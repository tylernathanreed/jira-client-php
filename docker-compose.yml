services:
    dev:
        build:
            context: ./vendor/reedware/sail-lite/runtimes/8.3
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.3/dev
        environment:
            WWWUSER: '${WWWUSER}'
        volumes:
            - '.:/var/www/html'
