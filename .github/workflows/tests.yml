name: Tests

on:
  push:
    branches-ignore:
      - auto-update-**
  pull_request:

jobs:
  linux_tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        include:
          - php: 8.1
            guzzle: false
          - php: 8.4
            guzzle: false
          - php: 8.1
            guzzle: ^6.5
          - php: 8.1
            guzzle: ^7.5
          - php: 8.2
            guzzle: ^7.5
          - php: 8.3
            guzzle: ^7.5
          - php: 8.4
            guzzle: ^7.5

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, gd
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 2
          command: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Remove Guzzle
        run: composer remove php-coveralls/php-coveralls --dev

      - name: Install Guzzle
        if: ${{ matrix.guzzle != null }}
        run: composer require guzzlehttp/guzzle ${{ matrix.guzzle }}
          
      - name: Execute tests
        run: vendor/bin/phpunit --no-coverage
